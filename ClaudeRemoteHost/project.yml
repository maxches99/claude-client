# xcodegen spec for the Mac menu-bar app that hosts the ccremote daemon.
#   cd ClaudeRemoteHost && xcodegen generate && open ClaudeRemoteHost.xcodeproj
# or scripts/build-mac-app.sh for a signed .app + zip in dist/.
name: ClaudeRemoteHost
options:
  bundleIdPrefix: dev.maxches
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
packages:
  claude-remote:
    path: ..
targets:
  ClaudeRemoteHost:
    type: application
    platform: macOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: claude-remote
        product: ClaudeRemoteDaemon
      - package: claude-remote
        product: ClaudeCodeHost
      - package: claude-remote
        product: ClaudeRemoteCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ClaudeRemote Host
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "14.0"
        # Menu-bar only: no Dock icon, no main menu.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© Max Chesnikov"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: ClaudeRemote Host
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxches.ccremote
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # No sandbox: the app runs the claude CLI, reads ~/.claude and talks to launchd.
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        # Sign to run locally by default; scripts/build-mac-app.sh passes a real identity when TEAM_ID is set.
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: true
        DEAD_CODE_STRIPPING: true
        SWIFT_STRICT_CONCURRENCY: minimal
