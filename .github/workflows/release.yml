name: Release

# Push a tag like v1.0.1 and this builds the Mac host (ad-hoc signed zip) and the unsigned iOS .ipa,
# publishes both as a GitHub Release together with the AltStore/SideStore source, and bumps the cask in
# maxches99/homebrew-tap. No Apple developer account involved: Homebrew drops the quarantine flag on the
# Mac, and AltStore/SideStore re-sign the .ipa with the user's own Apple ID on the phone.
#
# Secrets: TAP_GITHUB_TOKEN — a fine-grained PAT with "Contents: read and write" on homebrew-tap.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build and publish the release
    runs-on: macos-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      zip_sha256: ${{ steps.sums.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install Tuist
        run: brew install tuist
      - name: Version from the tag
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Build the Mac host app
        env:
          MARKETING_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
        run: scripts/build-mac-app.sh
      - name: Build the iOS app (unsigned .ipa)
        env:
          MARKETING_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
        run: scripts/build-ios-ipa.sh
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > dist/notes.md || : > dist/notes.md
      - name: Checksums and the AltStore source
        id: sums
        run: |
          cd dist
          shasum -a 256 ClaudeRemote-Host.zip ClaudeRemote.ipa > SHA256SUMS
          cat SHA256SUMS
          echo "zip_sha256=$(shasum -a 256 ClaudeRemote-Host.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cd ..
          scripts/release/altstore-source.sh "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.build }}" \
            dist/ClaudeRemote.ipa \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ClaudeRemote.ipa" \
            dist/notes.md > dist/altstore.json
          jq . dist/altstore.json > /dev/null
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat dist/notes.md
            echo
            echo '## Install'
            echo
            echo '**Mac:** `brew install --cask maxches99/tap/claude-remote-host` (or download the zip, unzip, run `xattr -dr com.apple.quarantine "ClaudeRemote Host.app"`, drag to Applications).'
            echo
            echo "**iPhone:** add \`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/altstore.json\` as a source in AltStore or SideStore, or sideload \`ClaudeRemote.ipa\` with Sideloadly."
          } > dist/body.md
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file dist/body.md \
            dist/ClaudeRemote-Host.zip dist/ClaudeRemote.ipa dist/altstore.json dist/SHA256SUMS

  tap:
    name: Bump the Homebrew cask
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: maxches99/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      - name: Write the cask
        run: |
          mkdir -p tap/Casks
          scripts/release/cask.sh "${{ needs.build.outputs.version }}" "${{ needs.build.outputs.zip_sha256 }}" \
            > tap/Casks/claude-remote-host.rb
      - name: Commit and push
        run: |
          cd tap
          git config user.name "Max Chesnikov"
          git config user.email "maxches99@gmail.com"
          git add Casks/claude-remote-host.rb
          git diff --cached --quiet && { echo "cask unchanged"; exit 0; }
          git commit -m "claude-remote-host ${{ needs.build.outputs.version }}"
          git push
