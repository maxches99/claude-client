name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Swift package (daemon, core, tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version && swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  apps:
    name: iOS, watchOS and Mac apps (Tuist)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install Tuist
        run: brew install tuist
      - name: Generate the workspace
        run: tuist generate --no-open
      - name: Build the iOS app (with the Watch app and the widgets)
        run: |
          xcodebuild -workspace ClaudeRemote.xcworkspace -scheme ClaudeRemote \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Build the Mac host app
        run: |
          xcodebuild -workspace ClaudeRemote.xcworkspace -scheme ClaudeRemoteHost \
            -destination 'platform=macOS' -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
