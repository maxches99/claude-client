name: ClaudeRemote
options:
  bundleIdPrefix: dev.maxches
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  claude-remote:
    path: ..
targets:
  ClaudeRemote:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: claude-remote
        product: ClaudeRemoteCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ClaudeRemote
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Finds and connects to ccremote running on your Mac.
        NSBonjourServices: ["_ccremote._tcp"]
        NSCameraUsageDescription: Scans the pairing QR code shown by ccremote.
        NSFaceIDUsageDescription: Unlocks the app and confirms approvals before they run on your Mac.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: dev.maxches.ccremote.pair
            CFBundleURLSchemes: [ccremote]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
