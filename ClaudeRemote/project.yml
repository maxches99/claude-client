name: ClaudeRemote
options:
  bundleIdPrefix: dev.maxches
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  claude-remote:
    path: ..
targets:
  ClaudeRemote:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: claude-remote
        product: ClaudeRemoteCore
      - target: ClaudeRemoteWatch
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ClaudeRemote
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Finds and connects to ccremote running on your Mac.
        NSBonjourServices: ["_ccremote._tcp"]
        NSCameraUsageDescription: Scans the pairing QR code shown by ccremote.
        NSFaceIDUsageDescription: Unlocks the app and confirms approvals before they run on your Mac.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: dev.maxches.ccremote.pair
            CFBundleURLSchemes: [ccremote]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: false

  ClaudeRemoteWatch:
    type: application
    platform: watchOS
    sources:
      - ClaudeRemoteWatch/Sources
    dependencies:
      - package: claude-remote
        product: ClaudeRemoteCore
      - target: ClaudeRemoteWatchWidget
        embed: true
    info:
      path: ClaudeRemoteWatch/Info.plist
      properties:
        CFBundleDisplayName: ClaudeRemote
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.maxches.ClaudeRemote
        NSLocalNetworkUsageDescription: Connects to ccremote on your Mac.
        NSBonjourServices: ["_ccremote._tcp"]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: dev.maxches.ccremote.watch
            CFBundleURLSchemes: [ccwatch]
    entitlements:
      path: ClaudeRemoteWatch/ClaudeRemoteWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.maxches.ccremote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxches.ClaudeRemote.watchkitapp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: false

  ClaudeRemoteWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - ClaudeRemoteWatchWidget/Sources
    dependencies:
      - package: claude-remote
        product: ClaudeRemoteCore
    info:
      path: ClaudeRemoteWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: ccremote
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ClaudeRemoteWatchWidget/ClaudeRemoteWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.maxches.ccremote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maxches.ClaudeRemote.watchkitapp.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
